# Prod monitoring stack for the Jitsi VPS.
# Grafana is public at https://status.rapport-game.online through the Jitsi web container.
# Probe and Prometheus stay on 127.0.0.1. SSH tunnel for those two:
#
#   ssh -L 8081:127.0.0.1:8081 -L 9090:127.0.0.1:9090 user@vps

services:
  probe:
    build: .
    image: rapport-probe:latest
    restart: unless-stopped
    environment:
      SERVER_PORT: "8081"
      PROBE_INTERVAL: "15000"
      PROBE_TARGETS_0_NAME: api
      PROBE_TARGETS_0_URL: https://rapport-api.fly.dev/api/health
      PROBE_TARGETS_1_NAME: jitsi
      PROBE_TARGETS_1_URL: https://meet.rapport-game.online/
    ports:
      # 8080 on the VPS is taken by jitsi-jvb
      - "127.0.0.1:8081:8081"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - probe

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://status.rapport-game.online
      GF_SERVER_DOMAIN: status.rapport-game.online
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /dashboards/probe.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - default
      - jitsiweb
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  jitsiweb:
    external: true
    name: jitsi_meet.jitsi
